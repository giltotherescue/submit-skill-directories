id: cursor-marketplace-official
name: Cursor Marketplace (official)
description: >
  Anysphere-reviewed official Cursor Marketplace for flagship plugins.
  Manual review before public listing; separate from cursor.directory community index.
status: active

access:
  class: web_form
  url: https://cursor.com/marketplace/publish
  notes: >
    Submit one plugin at a time. Expect manual security and quality review.
    Team marketplaces can import multi-plugin repos without this review path.

listing_unit: plugin
splits_skills: false

hosts:
  - cursor

item_types:
  - plugin
  - skill
  - mcp

install_guidance: >
  Users install from Cursor Marketplace (Customize → Plugins / Marketplace).
  Team admins can also import via Dashboard → Plugins → Team Marketplaces.

proposal_fields:
  - public_repo_url
  - plugin_name
  - plugin_description
  - logo_url
  - install_copy

references:
  - label: Publish form
    url: https://cursor.com/marketplace/publish
  - label: Cursor plugins docs
    url: https://cursor.com/docs/plugins
  - label: Marketplace security
    url: https://cursor.com/help/security-and-privacy/marketplace-security

tags:
  - cursor
  - official
  - reviewed
