id: cursor-directory
name: cursor.directory
description: >
  Community discovery site for Cursor plugins, MCP servers, rules, skills, agents, and hooks.
  Auto-detects Open Plugins / Agent Plugins layout from a public GitHub repo URL.
status: active

access:
  class: web_form
  url: https://cursor.directory/plugins/new
  notes: >
    Sign in with GitHub or Google. Paste a public repo URL; components are auto-detected.
    No catalog repo to clone.

listing_unit: either
splits_skills: false

hosts:
  - cursor

item_types:
  - skill
  - plugin
  - mcp
  - rules
  - agents

install_guidance: >
  Tell users to install via Cursor Customize / Plugins or a team marketplace import.
  Do not lead with npx skills add or per-path skill CLIs.

proposal_fields:
  - public_repo_url
  - listing_title
  - listing_description
  - listing_unit
  - install_copy

references:
  - label: Submit plugin
    url: https://cursor.directory/plugins/new
  - label: Cursor plugins docs
    url: https://cursor.com/docs/plugins

tags:
  - cursor
  - community
  - auto-detect
