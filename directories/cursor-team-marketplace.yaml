id: cursor-team-marketplace
name: Cursor Team Marketplace (import)
description: >
  Private or team-scoped Cursor marketplace imported from a GitHub repo URL.
  Not a public directory — admins add marketplaces in Dashboard → Plugins → Team Marketplaces.
status: active

access:
  class: web_form
  url: https://cursor.com/docs/plugins
  notes: >
    Requires Cursor team/enterprise admin. Import from repo without Anysphere public review.
    Best path for monorepos shipping many plugins or a bundled plugin suite to one org.

listing_unit: product
splits_skills: false

hosts:
  - cursor

item_types:
  - plugin
  - skill
  - mcp

install_guidance: >
  Team members install from Customize → Plugins after admin publishes marketplace import.

proposal_fields:
  - public_or_private_repo_url
  - marketplace_name
  - plugin_ids_in_repo
  - admin_contact

references:
  - label: Cursor plugins docs
    url: https://cursor.com/docs/plugins
  - label: Team marketplace section
    url: https://cursor.com/docs/plugins#team-marketplaces

tags:
  - cursor
  - team
  - private-marketplace
